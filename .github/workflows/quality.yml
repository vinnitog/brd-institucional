name: Validate contact regression
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  private-automation-access:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE_NUMBER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/bootstrap-private-ci
        with:
          ci-ssh-key: ${{ secrets.BRD_CI_SSH_KEY }}
          utilities-ssh-key: ${{ secrets.TECHTOGS_UTILITIES_SSH_KEY }}
          include-utilities: 'true'
      - run: python3 -I /var/lib/brd-ci-provider/bridge.py provider-check
  automation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run build:pages
